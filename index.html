<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stylish Scientific Calculator</title>
    <style>
        /* CSS VARIABLES: Matching the Converter Tool Theme */
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --text-main: #1f2937;
            --card-bg: rgba(255, 255, 255, 0.98);
        }

        /* LAYOUT: Centering the calculator */
        body { 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0;
            background: var(--bg-gradient);
        }

        /* CARD STYLING */
        .calculator { 
            background: var(--card-bg);
            padding: 2rem; 
            border-radius: 24px; 
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2); 
            width: 100%; max-width: 360px;
        }

        /* DISPLAY BOX */
        #display { 
            width: 100%; height: 70px; font-size: 28px; text-align: right; 
            margin-bottom: 15px; padding: 15px; box-sizing: border-box; 
            border: 2px solid #e5e7eb; border-radius: 12px; 
            background: #f8fafc; color: var(--text-main); outline: none; 
        }

        /* BUTTON GRIDS */
        .buttons, .scientific-keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        
        .scientific-keys { display: none; margin-bottom: 10px; }

        /* BUTTON STYLES */
        button { 
            padding: 15px; font-size: 16px; font-weight: 600; border: none; 
            border-radius: 10px; cursor: pointer; background: #edf2f7; 
            color: var(--text-main); transition: all 0.2s; 
        }

        button:hover { background: #e2e8f0; transform: translateY(-2px); }

        /* SPECIAL BUTTON COLORS */
        .operator { background: #fef3c7; color: #d97706; }
        .operator:hover { background: #fde68a; }

        .equals { background: var(--primary); color: white; grid-column: span 2; }
        .equals:hover { background: var(--primary-hover); }

        .toggle-btn { 
            background: var(--primary); color: white; grid-column: span 4; 
            margin-bottom: 15px; width: 100%; font-weight: bold;
        }

        .sci-btn { background: #e0e7ff; color: #4338ca; font-size: 13px; }
    </style>
</head>
<body>

<div class="calculator">
    <!-- Mode Toggle -->
    <button class="toggle-btn" onclick="toggleScientific()">Switch to Scientific Mode</button>
    
    <!-- Result Display -->
    <input type="text" id="display" placeholder="0" readonly>
    
    <!-- Scientific Logic Keys (Hidden by default) -->
    <div id="scientific-keys" class="scientific-keys">
        <button class="sci-btn" onclick="appendValue('Math.sin(')">sin</button>
        <button class="sci-btn" onclick="appendValue('Math.cos(')">cos</button>
        <button class="sci-btn" onclick="appendValue('Math.tan(')">tan</button>
        <button class="sci-btn" onclick="appendValue('Math.log(')">log</button>
        <button class="sci-btn" onclick="appendValue('Math.PI')">π</button>
        <button class="sci-btn" onclick="appendValue('Math.E')">e</button>
        <button class="sci-btn" onclick="appendValue('**')">^</button>
        <button class="sci-btn" onclick="appendValue('Math.sqrt(')">√</button>
    </div>

    <!-- Standard Keypad -->
    <div class="buttons">
        <button onclick="clearDisplay()">C</button>
        <button onclick="deleteLast()">DEL</button>
        <button onclick="appendValue('(')">(</button>
        <button onclick="appendValue('/')" class="operator">÷</button>
        
        <button onclick="appendValue('7')">7</button>
        <button onclick="appendValue('8')">8</button>
        <button onclick="appendValue('9')">9</button>
        <button onclick="appendValue('*')" class="operator">×</button>
        
        <button onclick="appendValue('4')">4</button>
        <button onclick="appendValue('5')">5</button>
        <button onclick="appendValue('6')">6</button>
        <button onclick="appendValue('-')" class="operator">−</button>
        
        <button onclick="appendValue('1')">1</button>
        <button onclick="appendValue('2')">2</button>
        <button onclick="appendValue('3')">3</button>
        <button onclick="appendValue('+')" class="operator">+</button>
        
        <button onclick="appendValue('0')">0</button>
        <button onclick="appendValue('.')">.</button>
        <button onclick="calculate()" class="equals">=</button>
    </div>
</div>

<script>
    const display = document.getElementById('display');
    let isScientific = false;

    /** KEYBOARD SUPPORT: Maps physical keys to calculator functions */
    document.addEventListener('keydown', (event) => {
        const key = event.key;
        const validKeys = '0123456789+-*/.()^';

        if (validKeys.includes(key)) {
            appendValue(key === '^' ? '**' : key);
        } else if (key === 'Enter') {
            event.preventDefault(); 
            calculate();
        } else if (key === 'Backspace') {
            deleteLast();
        } else if (key === 'Escape') {
            clearDisplay();
        }
    });

    /** Switch between basic and scientific button layouts */
    function toggleScientific() {
        const sciKeys = document.getElementById('scientific-keys');
        const toggleBtn = document.querySelector('.toggle-btn');
        isScientific = !isScientific;
        sciKeys.style.display = isScientific ? 'grid' : 'none';
        toggleBtn.innerText = isScientific ? 'Switch to Normal Mode' : 'Switch to Scientific Mode';
    }

    /** Add character to the display input */
    function appendValue(val) {
        display.value += val;
    }

    /** Reset the display */
    function clearDisplay() {
        display.value = '';
    }

    /** Remove the last character entered */
    function deleteLast() {
        display.value = display.value.slice(0, -1);
    }

    /** Execute the calculation using JavaScript's Function constructor */
    function calculate() {
        try {
            // Evaluates the string in the display as a math expression
            const result = new Function('return ' + display.value)();
            display.value = Number.isFinite(result) ? result : 'Error';
        } catch (e) {
            display.value = 'Error';
            setTimeout(clearDisplay, 1500); // Clear error after 1.5s
        }
    }
</script>

</body>
</html>
